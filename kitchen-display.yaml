esphome:
  name: kitchen-dashboard
  friendly_name: Kitchen Dashboard
  on_boot:
    priority: 800
    then:
      - delay: 5s

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG: "y"
      CONFIG_ESP_CONSOLE_UART_DEFAULT: "n"

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_CDC
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

http_request:
  verify_ssl: false

# --- NEW: TIME & SYNCHRONIZATION ---
time:
  - platform: sntp
    id: sntp_time
    timezone: "AWST-8" 
    on_time:
      - seconds: 0
        minutes: 28, 58 
        then:
          - component.update: dashboard_image

# --- NEW: BATTERY FONT & SENSORS ---
font:
  - file: "font/Amazon Ember Bold.ttf"
    id: font_battery
    size: 16

switch:
  - platform: gpio
    pin: GPIO21
    id: battery_enable
    restore_mode: ALWAYS_ON

sensor:
  - platform: adc
    pin: GPIO1
    name: "Battery Voltage"
    id: battery_v
    update_interval: 60s
    attenuation: 11db
    filters:
      - multiply: 2.0

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

online_image:
  - url: https://raw.githubusercontent.com/scrivenah/kitchen-dashboard/main/dashboard.png
    id: dashboard_image
    format: png
    type: RGB
    update_interval: never # Controlled by the SNTP time block now
    on_download_finished:
      then:
        - component.update: epaper_display

display:
  - platform: epaper_spi
    id: epaper_display
    model: Seeed-reTerminal-E1002
    update_interval: never
    lambda: |-
      // 1. Draw the downloaded image
      it.image(0, 0, id(dashboard_image));
      
      // 2. Stamp the battery over the top right corner
      if (id(battery_v).has_state()) {
        it.printf(780, 20, id(font_battery), Color(0,0,0), TextAlign::TOP_RIGHT, "%.1fV", id(battery_v).state);
      } else {
        it.printf(780, 20, id(font_battery), Color(0,0,0), TextAlign::TOP_RIGHT, "--V");
      }
