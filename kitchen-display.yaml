esphome:
  name: kitchen-dashboard
  friendly_name: Kitchen Dashboard
  on_boot:
    priority: 800
    then:
      - delay: 5s

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG: "y"
      CONFIG_ESP_CONSOLE_UART_DEFAULT: "n"

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_CDC
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

http_request:
  verify_ssl: false

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

display:
  - platform: epaper_spi
    id: epaper_display
    model: Seeed-reTerminal-E1002
    update_interval: never
    lambda: |-
      it.image(0, 0, id(dashboard_image));

online_image:
  - url: https://raw.githubusercontent.com/scrivenah/kitchen-dashboard/main/dashboard.png
    id: dashboard_image
    format: png
    type: RGB
    update_interval: 15min
    on_download_finished:
      then:
        - component.update: epaper_display
