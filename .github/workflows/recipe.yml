name: Generate Kitchen Recipe Card

on:
  repository_dispatch:
    types: [render_recipe]
  workflow_dispatch:
    inputs:
      recipe_url:
        description: 'URL of the recipe to condense and render'
        required: true
        type: string

jobs:
  build-recipe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install curl_cffi recipe-scrapers google-genai pillow

      - name: Scrape & Render Recipe
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RECIPE_URL: ${{ github.event.client_payload.recipe_url || inputs.recipe_url }}
        run: |
          python fetch_recipe.py
          python render_recipe.py

      - name: Commit Recipe Graphic
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add current_recipe.json recipe.png
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update recipe card [skip ci]" && git push)

      - name: Send Recipe Card Notification
        if: success()
        run: |
          RECIPE_TITLE=$(jq -r '.title' current_recipe.json 2>/dev/null || echo "New recipe ready")
          curl \
            -H "Title: Recipe Ready 🍳" \
            -H "Message: ${RECIPE_TITLE}" \
            -H "Filename: recipe.png" \
            -H "Priority: high" \
            -H "Tags: white_check_mark,shallow_pan_of_food" \
            -T recipe.png \
            https://ntfy.sh/scriv-kitchen-recipe
