name: Build ESPHome Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESPHome and Esptool
        run: pip install esphome pillow esptool

      - name: Create secrets file
        run: |
          echo "wifi_ssid: \"${{ secrets.WIFI_SSID }}\"" > secrets.yaml
          echo "wifi_password: \"${{ secrets.WIFI_PASSWORD }}\"" >> secrets.yaml

      - name: Compile Firmware
        run: esphome compile kitchen-display.yaml

      - name: Merge Factory Binary
        run: |
          mkdir -p output
          
          # Find directory containing flasher_args.json
          BUILD_DIR=$(dirname $(find .esphome -name "flasher_args.json" | head -n 1))
          echo "Found build directory: $BUILD_DIR"
          
          cd "$BUILD_DIR"
          
          # Read flasher_args.json and merge all binaries at their exact offsets
          python -m esptool --chip esp32s3 merge-bin \
            --output "$GITHUB_WORKSPACE/output/factory.bin" \
            --flash-mode dio \
            --flash-size 16MB \
            @flash_args
            
          ls -lh "$GITHUB_WORKSPACE/output/factory.bin"

      - name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: reterminal-firmware
          path: output/factory.bin
