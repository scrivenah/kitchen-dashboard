name: Build ESPHome Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESPHome and Esptool
        run: pip install esphome pillow esptool

      - name: Create secrets file
        run: |
          echo "wifi_ssid: \"${{ secrets.WIFI_SSID }}\"" > secrets.yaml
          echo "wifi_password: \"${{ secrets.WIFI_PASSWORD }}\"" >> secrets.yaml

      - name: Compile Firmware
        run: esphome compile kitchen-display.yaml

      - name: Merge Factory Binary
        run: |
          mkdir -p output
          
          # Dynamically find the exact paths using wildcards/correct names
          BOOTLOADER=$(find .esphome -name "bootloader.bin" | head -n 1)
          PARTITIONS=$(find .esphome -name "partition*.bin" | head -n 1)
          OTA=$(find .esphome -name "ota_data_initial.bin" | head -n 1)
          APP=$(find .esphome -name "firmware.bin" | head -n 1)
          
          echo "Bootloader: $BOOTLOADER"
          echo "Partitions: $PARTITIONS"
          echo "OTA Data: $OTA"
          echo "Application: $APP"
          
          # Merge them using the exact offsets from the ESP-IDF configuration
          python -m esptool --chip esp32s3 merge_bin \
            -o output/factory.bin \
            --flash_mode dio \
            --flash_size 16MB \
            0x0 "$BOOTLOADER" \
            0x8000 "$PARTITIONS" \
            0x9000 "$OTA" \
            0x10000 "$APP"
            
          ls -lh output/

      - name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: reterminal-firmware
          path: output/factory.bin
