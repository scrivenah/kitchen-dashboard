name: Update Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '25,55 * * * *'

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Render dashboard
        env:
          CALENDAR_ICS_URLS: ${{ secrets.CALENDAR_ICS_URLS }}
          ECOWITT_APPLICATION_KEY: ${{ secrets.ECOWITT_APPLICATION_KEY }}
          ECOWITT_API_KEY: ${{ secrets.ECOWITT_API_KEY }}
          ECOWITT_MAC: ${{ secrets.ECOWITT_MAC }}
        run: python render.py

      - name: Commit and push updated dashboard
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update dashboard preview [skip ci]"
          file_pattern: "dashboard.png"
