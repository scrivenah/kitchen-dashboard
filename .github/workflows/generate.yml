name: Generate Daily Dashboard

on:
  schedule:
    # 21:00 UTC = 5:00 AM AWST
    # 01:05 UTC = 9:05 AM AWST (to catch the 9am rain reset!)
    - cron: '0 21,1 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          pip install -r requirements.txt

      - name: Run Script to Render Dashboard
        run: |
          python render.py

      - name: Commit Dashboard Image
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update dashboard preview [skip ci]"
          file_pattern: "dashboard.png"
